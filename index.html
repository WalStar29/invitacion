<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Invitación Digital - Revelación de Género</title>
    <!-- Font Awesome para los íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100vh;
            height: 100dvh; /* Adaptable a la barra del navegador móvil */
            overflow: hidden; /* Evita cualquier scroll */
        }

        body {
            /* Fondo Rosa Claro, Llamativo y Luminoso */
            background: radial-gradient(circle at center, #fff0f5 0%, #ffb6c1 50%, #ff9ebb 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* --- FONDO DE ESTRELLAS Y DESTELLOS ANIMADOS --- */
        .stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            pointer-events: none;
            z-index: 1;
        }

        .star {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.9), 0 0 12px rgba(255, 182, 193, 0.6);
            animation: twinkleAndFloat linear infinite;
        }

        @keyframes twinkleAndFloat {
            0% {
                transform: translateY(0) scale(0.5);
                opacity: 0.2;
            }
            50% {
                opacity: 1;
                transform: translateY(-25px) scale(1.3);
            }
            100% {
                transform: translateY(-50px) scale(0.5);
                opacity: 0.2;
            }
        }

        /* --- CONTENEDOR PRINCIPAL --- */
        .main-wrapper {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            max-width: 420px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            position: relative;
            z-index: 10;
            perspective: 1200px;
        }

        /* --- ESCENA DEL SOBRE CON CARTA INTERNA --- */
        .scene-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- SOBRE ELEGANTE EN TONOS MARFIL Y DORADO 3D --- */
        .envelope-container {
            position: absolute;
            width: 280px;
            height: 185px;
            background: #fffdfa;
            border-radius: 14px;
            box-shadow: 0 15px 35px rgba(212, 140, 160, 0.35), inset 0 0 15px rgba(212, 175, 55, 0.1);
            border: 1.5px solid rgba(212, 175, 55, 0.5);
            cursor: pointer;
            perspective: 1000px;
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 5;
        }

        .envelope-container:hover {
            transform: scale(1.02);
            box-shadow: 0 20px 40px rgba(212, 140, 160, 0.45);
        }

        /* Solapa Superior del Sobre (Flap) */
        .envelope-container .flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 140px solid transparent;
            border-right: 140px solid transparent;
            border-top: 105px solid #fffaf0;
            transform-origin: top;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), z-index 0.2s 0.3s;
            z-index: 7;
            filter: drop-shadow(0 4px 6px rgba(180, 140, 50, 0.15));
        }

        /* Bolsillo Inferior del Sobre */
        .envelope-container .pocket {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 140px solid #fcf8f2;
            border-right: 140px solid #f8f3ea;
            border-bottom: 100px solid #fffdfa;
            border-bottom-left-radius: 14px;
            border-bottom-right-radius: 14px;
            z-index: 6;
        }

        /* Sello Dorado Elegante */
        .seal-button {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            width: 58px;
            height: 58px;
            background: linear-gradient(135deg, #f3e0aa 0%, #d4af37 50%, #aa7c11 100%);
            border: 2px solid #ffffff;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 8;
            box-shadow: 0 6px 18px rgba(170, 124, 17, 0.4);
            transition: all 0.4s ease;
            animation: pulseGlow 2s infinite;
        }

        @keyframes pulseGlow {
            0% { transform: translateX(-50%) scale(1); box-shadow: 0 0 12px rgba(212, 175, 55, 0.6); }
            50% { transform: translateX(-50%) scale(1.08); box-shadow: 0 0 22px rgba(212, 175, 55, 0.95); }
            100% { transform: translateX(-50%) scale(1); box-shadow: 0 0 12px rgba(212, 175, 55, 0.6); }
        }

        .seal-button i {
            font-size: 16px;
            color: #ffffff;
            margin-bottom: 2px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.3);
        }

        .seal-button span {
            font-size: 7.5px;
            font-weight: 700;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.3);
        }

        /* ESTADO: SOBRE ABIERTO Y EMERGIENDO LA CARTA */
        .envelope-container.open .flap {
            transform: rotateX(180deg);
            z-index: 2;
        }

        /* El sobre se achica y desaparece */
        .envelope-container.shrink-hide {
            transform: scale(0.1) translateY(200px);
            opacity: 0;
            pointer-events: none;
        }

        /* --- TARJETA DENTRO DEL SOBRE Y DESPLEGABLE --- */
        .invitation-card {
            position: absolute;
            width: 260px;
            max-height: 94dvh;
            background: rgba(255, 255, 255, 0.97);
            padding: 10px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15), 0 0 0 1px rgba(212, 175, 55, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            z-index: 3;
            transform: translateY(15px) scale(0.85);
            opacity: 0;
            pointer-events: none;
            transition: all 0.9s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Estado: La carta emerge del sobre y se agranda sin salirse de la pantalla */
        .invitation-card.card-emerge {
            opacity: 1;
            z-index: 20;
            pointer-events: auto;
            position: relative;
            width: 100%;
            max-width: 330px;
            transform: translateY(0) scale(1);
        }

        /* Imagen de la Plantilla */
        .invitation-img {
            width: 100%;
            height: auto;
            max-height: 52dvh;
            object-fit: contain;
            border-radius: 8px;
            display: block;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        /* --- SECCIÓN DE CONTEO REGRESIVO COMPACTO --- */
        .countdown-container {
            width: 100%;
            background: linear-gradient(135deg, #ffffff 0%, #fff0f5 100%);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 10px;
            padding: 5px 4px;
            text-align: center;
            box-shadow: 0 2px 6px rgba(212, 175, 55, 0.1);
        }

        .countdown-title {
            font-size: 0.6rem;
            font-weight: 700;
            color: #724e5b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 3px;
        }

        .timer {
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .timer-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 42px;
        }

        .timer-number {
            font-size: 0.95rem;
            font-weight: 700;
            color: #d47a96;
            background: #ffffff;
            width: 100%;
            padding: 2px 0;
            border-radius: 6px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
            border: 1px solid #ffe3ec;
        }

        .timer-label {
            font-size: 0.5rem;
            color: #8c6b77;
            margin-top: 2px;
            font-weight: 600;
            text-transform: uppercase;
        }

        /* Botones de Acción Compactos */
        .action-buttons {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 3px 8px rgba(0,0,0,0.1);
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-whatsapp {
            background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
            color: #ffffff;
        }

        .btn-close {
            background: linear-gradient(135deg, #a88b97 0%, #7d626e 100%);
            color: #ffffff;
        }

        /* Adjustes para pantallas pequeñas (iPhone SE, etc.) */
        @media (max-height: 667px) {
            .invitation-img {
                max-height: 44dvh;
            }
            .countdown-container {
                padding: 3px 4px;
            }
            .btn {
                padding: 6px 10px;
                font-size: 0.75rem;
            }
        }

        /* Confeti Canvas */
        #canvas-confetti {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>
<body>

    <!-- Fondo Interactivo de Estrellas -->
    <div class="stars-container" id="stars-container"></div>

    <canvas id="canvas-confetti"></canvas>

    <div class="main-wrapper">

        <div class="scene-container" id="scene-container">

            <!-- SOBRE BLANCO Y DORADO INTERACTIVO -->
            <div class="envelope-container" id="envelope" onclick="openEnvelope()">
                <div class="flap"></div>
                <div class="pocket"></div>
                <div class="seal-button">
                    <i class="fa-solid fa-envelope-open-text"></i>
                    <span>Toca abrir</span>
                </div>
            </div>

            <!-- TARJETA DESPLEGABLE DENTRO DEL SOBRE -->
            <div class="invitation-card" id="card">
                
                <!-- Imagen de la invitación -->
                <img src="carta.png" alt="Invitación Revelación de Género" class="invitation-img">

                <!-- Conteo Regresivo -->
                <div class="countdown-container">
                    <div class="countdown-title">Faltan para el gran día</div>
                    <div class="timer">
                        <div class="timer-box">
                            <span class="timer-number" id="days">00</span>
                            <span class="timer-label">Días</span>
                        </div>
                        <div class="timer-box">
                            <span class="timer-number" id="hours">00</span>
                            <span class="timer-label">Horas</span>
                        </div>
                        <div class="timer-box">
                            <span class="timer-number" id="minutes">00</span>
                            <span class="timer-label">Min</span>
                        </div>
                        <div class="timer-box">
                            <span class="timer-number" id="seconds">00</span>
                            <span class="timer-label">Seg</span>
                        </div>
                    </div>
                </div>

                <div class="action-buttons">
                    <!-- WhatsApp -->
                    <a href="https://wa.me/584125952906?text=%C2%A1Hola!%20Confirmo%20mi%20asistencia%20a%20la%20Revelaci%C3%B3n%20de%20G%C3%A9nero." 
                    target="_blank" 
                    class="btn btn-whatsapp">
                        <i class="fa-brands fa-whatsapp"></i> Confirmar Asistencia
                    </a>

                    <!-- Botón para cerrar y regresar al sobre -->
                    <button class="btn btn-close" onclick="closeEnvelope()">
                        <i class="fa-solid fa-envelope"></i> Guardar en el sobre
                    </button>
                </div>

            </div>

        </div>

    </div>

    <script>
        // 1. Generador de Estrellas Animadas en Fondo
        function initStars() {
            const container = document.getElementById('stars-container');
            const count = 45;

            for (let i = 0; i < count; i++) {
                const star = document.createElement('div');
                star.classList.add('star');

                const size = Math.random() * 2.5 + 1.5;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;

                star.style.left = `${Math.random() * 100}%`;
                star.style.top = `${Math.random() * 100}%`;

                star.style.animationDuration = `${Math.random() * 3 + 2}s`;
                star.style.animationDelay = `${Math.random() * 3}s`;

                container.appendChild(star);
            }
        }
        initStars();

        // 2. Conteo Regresivo en Tiempo Real hacia el 5 de Diciembre 06:30 PM
        function updateCountdown() {
            const now = new Date();
            let targetYear = now.getFullYear();
            
            let eventDate = new Date(targetYear, 11, 5, 18, 30, 0);

            if (now > eventDate) {
                eventDate = new Date(targetYear + 1, 11, 5, 18, 30, 0);
            }

            const difference = eventDate - now;

            if (difference > 0) {
                const days = Math.floor(difference / (1000 * 60 * 60 * 24));
                const hours = Math.floor((difference / (1000 * 60 * 60)) % 24);
                const minutes = Math.floor((difference / 1000 / 60) % 60);
                const seconds = Math.floor((difference / 1000) % 60);

                document.getElementById('days').innerText = String(days).padStart(2, '0');
                document.getElementById('hours').innerText = String(hours).padStart(2, '0');
                document.getElementById('minutes').innerText = String(minutes).padStart(2, '0');
                document.getElementById('seconds').innerText = String(seconds).padStart(2, '0');
            } else {
                document.getElementById('days').innerText = '00';
                document.getElementById('hours').innerText = '00';
                document.getElementById('minutes').innerText = '00';
                document.getElementById('seconds').innerText = '00';
            }
        }
        setInterval(updateCountdown, 1000);
        updateCountdown();

        // 3. Abrir sobre
        function openEnvelope() {
            const envelope = document.getElementById('envelope');
            const card = document.getElementById('card');

            envelope.classList.add('open');

            setTimeout(() => {
                card.classList.add('card-emerge');
                envelope.classList.add('shrink-hide');
                launchSideConfetti();
            }, 400);
        }

        // 4. Cerrar tarjeta
        function closeEnvelope() {
            const envelope = document.getElementById('envelope');
            const card = document.getElementById('card');

            card.classList.remove('card-emerge');
            envelope.classList.remove('shrink-hide');

            setTimeout(() => {
                envelope.classList.remove('open');
            }, 600);
        }

        // 5. Explosión de Confeti Dual desde los Lados (Rosa y Azul)
        function launchSideConfetti() {
            const canvas = document.getElementById('canvas-confetti');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            const pinkColors = ['#ff85a1', '#f72585', '#ffb3c6', '#ffd1dc'];
            const blueColors = ['#4ea8de', '#0077b6', '#90e0ef', '#caf0f8'];
            const goldColors = ['#d4af37', '#fef1c9'];

            // Lado izquierdo (Rosa)
            for (let i = 0; i < 40; i++) {
                particles.push({
                    x: 0,
                    y: canvas.height * 0.4 + (Math.random() * 0.3 * canvas.height),
                    rx: Math.random() * 6 + 4,
                    ry: Math.random() * 10 + 4,
                    color: Math.random() > 0.3 ? pinkColors[Math.floor(Math.random() * pinkColors.length)] : goldColors[Math.floor(Math.random() * goldColors.length)],
                    vx: Math.random() * 12 + 6,
                    vy: (Math.random() - 0.7) * 10,
                    gravity: 0.25,
                    rotation: Math.random() * 360,
                    vRot: (Math.random() - 0.5) * 10
                });
            }

            // Lado derecho (Azul)
            for (let i = 0; i < 40; i++) {
                particles.push({
                    x: canvas.width,
                    y: canvas.height * 0.4 + (Math.random() * 0.3 * canvas.height),
                    rx: Math.random() * 6 + 4,
                    ry: Math.random() * 10 + 4,
                    color: Math.random() > 0.3 ? blueColors[Math.floor(Math.random() * blueColors.length)] : goldColors[Math.floor(Math.random() * goldColors.length)],
                    vx: -(Math.random() * 12 + 6),
                    vy: (Math.random() - 0.7) * 10,
                    gravity: 0.25,
                    rotation: Math.random() * 360,
                    vRot: (Math.random() - 0.5) * 10
                });
            }

            function update() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let alive = false;

                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += p.gravity;
                    p.rotation += p.vRot;

                    if (p.y < canvas.height && p.x > -20 && p.x < canvas.width + 20) alive = true;

                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate((p.rotation * Math.PI) / 180);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.rx / 2, -p.ry / 2, p.rx, p.ry);
                    ctx.restore();
                });

                if (alive) {
                    requestAnimationFrame(update);
                }
            }

            update();
        }
    </script>
</body>
</html>
